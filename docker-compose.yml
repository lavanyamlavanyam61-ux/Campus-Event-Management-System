services:
  campus-events:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-event-management:latest
    container_name: campus-event-management
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/campus_events.db
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production}
      - ADMIN_INVITE_CODE=${ADMIN_INVITE_CODE:-MERIDIAN-ADMIN-2026}
      - DISABLE_DEMO_LOGIN=${DISABLE_DEMO_LOGIN:-false}
    volumes:
      - campus_events_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  campus_events_data:
